<script>
/* Which board is current?
 *
 * Week 1 is the week of Monday 17 August 2026. The class weekday is Mon/Tue/Wed
 * and unsettled, so this anchors on MONDAY — the earliest it can be — and the
 * board turns over at local midnight on Monday. Early is the safe direction:
 * a week has to be rehearsal-ready before the Monday anyway.
 *
 * The board runs from week 1, so anything earlier clamps to 1, and anything past
 * the end of term clamps to 16. Each week's board is a strict SUPERSET of the
 * one before — week 1 is the six values week 1's demo computes and nothing more,
 * and panels arrive in the week the course earns them. The board fills up as
 * their program does; that is the whole idea, so never backfill a later panel
 * into an earlier week.
 *
 * Rehearsal override: ?week=7 shows week 7's board on any date. That is the
 * supported way to look ahead — do not change the anchor to preview a week.
 */
var FIRST = 1, LAST = 16;
var START = new Date(2026, 7, 17);           // month is 0-indexed: 7 = August

function currentWeek() {
  var q = new URLSearchParams(location.search).get('week');
  if (q !== null) {
    var forced = parseInt(q, 10);
    if (!isNaN(forced)) return clamp(forced);
  }
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // round, not floor — a DST shift moves the raw millisecond gap by an hour
  var days = Math.round((today - START) / 86400000);
  return clamp(Math.floor(days / 7) + 1);
}

function clamp(n) { return Math.min(LAST, Math.max(FIRST, n)); }

var n = String(currentWeek()).padStart(2, '0');
location.replace('week-' + n + '.html');     // replace, so Back doesn't bounce here
</script>
