<script>
/* Which board is current?
 *
 * Computed in the visitor's browser on every load — there is no server, no
 * build and no scheduled job. Push a file and it is live.
 *
 * ── THE TWO THINGS TO EDIT ────────────────────────────────────────────────
 *   TERMS   add one line per semester. Never edit a term that has already run:
 *           its start date is what "week 5" meant for the people who were there.
 *   LATEST  the highest week-NN.html that actually EXISTS. Bump it in the same
 *           commit that adds a board, or the router points at a 404.
 * ──────────────────────────────────────────────────────────────────────────
 *
 * Anchor each term on its MONDAY. The class weekday is Mon/Tue/Wed and has
 * never been settled, so the board turns over at the earliest moment it could
 * be needed — a week has to be rehearsal-ready before the Monday anyway.
 *
 * Rehearsal override: ?week=7 shows any board on any date, and ignores LATEST
 * so an unwritten week can be previewed as a 404 rather than silently hidden.
 * That is the supported way to look ahead — never move an anchor to preview.
 */

var TERMS = [
  { start: new Date(2026, 7, 17) },        // Mon 17 Aug 2026 — first run, 16 weeks
  // { start: new Date(2027, 0, 11), short: true },   // a 15-week run: see below
];

var LATEST = 7;                            // boards written so far
var LAST = 16;                             // weeks in a full term

/* `short: true` marks a 15-week semester. Week 15 is the droppable flex week
 * and week 16 must work as week 15 — so in a short run, calendar week 15 shows
 * board 16 (the presentations board) and week 15's board is simply not used. */

function boardFor(now) {
  var q = new URLSearchParams(location.search).get('week');
  if (q !== null) {
    var forced = parseInt(q, 10);
    if (!isNaN(forced)) return Math.min(LAST, Math.max(1, forced));   // ignores LATEST
  }

  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // the most recent term that has already started; before the first, use the first
  var term = TERMS[0];
  for (var i = 0; i < TERMS.length; i++) {
    if (TERMS[i].start <= today) term = TERMS[i];
  }

  // round, not floor — a DST shift moves the raw millisecond gap by an hour
  var days = Math.round((today - term.start) / 86400000);
  var wk = Math.floor(days / 7) + 1;

  if (term.short && wk >= 15) wk = 16;     // 15-week run: wk 15 is the presentations
  return Math.min(LATEST, Math.min(LAST, Math.max(1, wk)));
}

var n = String(boardFor(new Date())).padStart(2, '0');
location.replace('week-' + n + '.html');   // replace, so Back doesn't bounce here
</script>
