<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Haldane Station duty console">
  <!--
    Drawn as plain rectangles, never as text in a font: a <text> favicon renders
    differently on every machine and can fall back to something unrecognisable.
    Rects are identical everywhere and stay crisp at 16px, which is the only
    size that actually matters.

    Colours are the board's own: panel dark and the amber used for the title.
    A filled dark square reads on both light and dark browser chrome, so there
    is no theme-aware variant to keep in sync.
  -->
  <rect width="64" height="64" rx="10" fill="#0b0d0e"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="8.5" fill="none" stroke="#1e2529" stroke-width="3"/>

  <!-- H for Haldane: two posts and a crossbar, heavy enough to hold at 16px -->
  <g fill="#e8b04b">
    <rect x="17" y="14" width="9" height="36"/>
    <rect x="38" y="14" width="9" height="36"/>
    <rect x="17" y="27" width="30" height="9"/>
  </g>
</svg>
